<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365 100" width="100%" height="100%">
  <defs>
    <!-- Purple to Pink Neon Gradient for the Q tail -->
    <linearGradient id="vyqo-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2BE2" />
      <stop offset="50%" stop-color="#B026FF" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>

    <!-- Subtle Drop Shadow for elements -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Letter V -->
  <polygon points="5,10 27,10 47,72 67,10 89,10 57,90 37,90" fill="#ffffff" />

  <!-- Letter Y -->
  <path d="M 90 10 L 111 10 L 130 50 L 149 10 L 170 10 L 140 70 L 140 90 L 120 90 L 120 70 Z" fill="#ffffff" />

  <!-- Letter Q (Circle + Accent Tail) -->
  <g>
    <!-- Main Q Ring (Compound path of outer and inner circle) -->
    <path d="M 220 10 A 40 40 0 1 0 220 90 A 40 40 0 1 0 220 10 Z M 220 26 A 24 24 0 1 1 220 74 A 24 24 0 1 1 220 26 Z" fill="#ffffff" fill-rule="evenodd" />
    
    <!-- Neon Gradient Tail, perfectly positioned and rotated -->
    <rect x="244" y="70" width="18" height="38" rx="9" transform="rotate(-45 244 70)" fill="url(#vyqo-accent-grad)" filter="url(#logo-glow)" />
  </g>

  <!-- Letter O -->
  <path d="M 310 10 A 40 40 0 1 0 310 90 A 40 40 0 1 0 310 10 Z M 310 26 A 24 24 0 1 1 310 74 A 24 24 0 1 1 310 26 Z" fill="#ffffff" fill-rule="evenodd" />
</svg>
